[project]
name = "orbitops"
version = "0.2.1"
description = "A command-line toolkit for satellite tracking and orbital analysis."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cartopy>=0.25.0",
    "matplotlib>=3.11.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sgp4>=2.27",
    "skyfield>=1.55",
]

[project.scripts]
orbitops = "orbitops.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "twine>=7.0.0",
]
