[project]
name = "orbitops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sgp4>=2.27",
    "skyfield>=1.55",
    "typer>=0.27.1",
    "typing>=3.10.0.0",
]

[project.scripts]
orbitops = "orbitops.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
